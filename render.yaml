services:
  - type: web
    name: magpipe-livekit-agent
    env: python
    region: oregon
    plan: starter
    rootDir: agents/livekit-voice-agent
    buildCommand: pip install -r requirements.txt
    startCommand: python agent.py start
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SIGNALWIRE_SPACE
        sync: false
      - key: SIGNALWIRE_PROJECT_ID
        sync: false
      - key: SIGNALWIRE_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: magpipe-claude-bot
    env: node
    region: oregon
    plan: starter
    rootDir: services/claude-debug-bot
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Slack — SEPARATE app from customer Slack integration. Never reuse
      # the customer-Slack OAuth client id, signing secret, or bot token.
      - key: SLACK_DEBUG_BOT_TOKEN
        sync: false
      - key: SLACK_DEBUG_SIGNING_SECRET
        sync: false
      - key: SLACK_DEBUG_TEAM_ID
        sync: false
      - key: SLACK_DEBUG_USER_ID
        sync: false
      # Anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      # Supabase — same values used by the rest of the platform
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      # Render — for log fetch + restart_service tool
      - key: RENDER_API_KEY
        sync: false
      # GitHub — for `git push` from the bash tool so the bot can ship
      # fixes (Render auto-deploys on push). PAT with repo scope.
      - key: GITHUB_TOKEN
        sync: false
