name: gitleaks

# Secret-scan backstop. Uses the open-source gitleaks BINARY (not gitleaks-action,
# which requires a paid GITLEAKS_LICENSE for organization repos). Scans only the
# commits introduced by this push/PR so it blocks NEW secrets without failing on
# pre-existing history.
on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          URL=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -oE 'https://[^"]*linux_x64\.tar\.gz' | head -1)
          echo "Downloading $URL"
          curl -sSfL "$URL" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan new commits for secrets
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE=""   # new branch / initial push — scan the tip commit only
          fi
          OPTS="${RANGE:+--log-opts=$RANGE}"
          [ -z "$RANGE" ] && OPTS="--log-opts=-1"
          echo "Scanning range: ${RANGE:-<tip>}"
          gitleaks detect --source . --redact --no-banner --exit-code 1 $OPTS
